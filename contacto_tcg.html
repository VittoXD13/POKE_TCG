<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/contacto.css">

</head>
<body>
    <header>
        <img src="image/Pokémon_Trading_Card_Game_logo_logo.svg.webp" 
        width="400" 
        height="200" 
        alt="Logo de pokemon" 
        style="display: block; margin-left: auto; margin-right: auto;">
        <nav class="menu">
            <a href="pokemon_tcg.html"> - INICIO - </a>
            <a href="productos_tcg.html"> - PRODUCTOS - </a>
            <a href="contacto_tcg.html"> - CONTACTO - </a>
        </nav>
    </header>

    <main>
        <form class="bg-white p-4 rounded shadow-sm mx-auto border border-danger" action="#" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre Completo</label><br>
                    <input class="form-control" type="text" id="nombre" name="nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="correo">Correo Electrónico</label><br>
                    <input class="form-control" type="email" id="correo" name="correo" required>
                </div>
            </div>


            <div class="mb-3">
                <label class="form-label" for="asunto">Asunto</label><br>
                <select class="form-select" id="asunto" name="asunto">
                    <option value="pedido">Estado de mi pedido</option>

                </select>
            </div>
            <div class="mb-4">
                <label class="form-label" for="mensaje">Mensaje</label><br>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="5"></textarea>
            </div>
            
            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="terminos">
                <label class="form-check-label" for="terminos">Acepto ser contactado por correo</label>
            </div>

            <div class="d-flex justify-content-end mx-3">
                <button class="btn btn-danger btn-lg" type="submit">Enviar</button>
            </div>

            <nav>
                <a href="xdd_tcg.html">Ir a la liga pokemon</a>
            </nav>

        </form>

    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
